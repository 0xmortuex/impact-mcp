[project]
name = "impact-mcp"
version = "0.1.0"
description = "MCP server that answers 'what depends on this file or symbol, and what breaks if I change it?' for Python and JS/TS projects: offline, read-only, honest about unresolved and dynamic imports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]
keywords = ["mcp", "dependency-graph", "impact-analysis", "imports", "python", "typescript", "refactoring", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/impact-mcp"

[project.scripts]
impact-mcp = "impact_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impact_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
